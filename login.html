<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#232527">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Login - Roblox</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="style.css">
</head>
<body class="login-body">
<div class="login-page">
  <div class="login-left">
    <div class="login-logo">ROBLOX</div>
    <h1 class="login-tagline">Powering Imagination</h1>
    <p class="login-sub">Log in to continue to Roblox</p>
  </div>
  <div class="login-right">
    <div class="login-card">
      <h2>Log In</h2>
      <input id="loginUser" type="text" placeholder="Username/Email">
      <input id="loginPass" type="password" placeholder="Password">
      <button class="login-btn" onclick="doLogin()">Log In</button>
      <div class="login-links">
        <span>Forgot Password?</span>
        <span>|</span>
        <span>Sign Up</span>
      </div>
      <div class="login-note">Any username and password work in this LARP.</div>
    </div>
  </div>
</div>

<script src="data.js"></script>
<script src="script.js"></script>
<script>registerServiceWorker();</script>
</body>
</html>
